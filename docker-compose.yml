services:
  daimon:
    build: .
    container_name: daimon
    restart: unless-stopped
    volumes:
      - ./configs/daimon.yaml:/app/configs/daimon.yaml:ro
      - daimon-data:/home/daimon/.daimon
    environment:
      - HOME=/home/daimon
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}

volumes:
  daimon-data:
