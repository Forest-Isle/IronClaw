# Daimon 配置示例
#
# 大部分功能默认开启，无需手动 enabled: true。
# 此文件中的 enabled 字段仅作为覆盖：省略则使用 Feature Registry 默认值。
# 运行时可通过 /feature list 查看所有功能状态，/feature enable|disable 开关功能。
#
# 默认开启: memory, skills, multi_agent
# 默认关闭: server, selfops

llm:
  provider: claude                               # "claude" (default) or "openai" / "openai-compatible"
  api_key: "${ANTHROPIC_API_KEY}"
  # base_url: "https://your-relay.example.com"   # custom base URL (relay, Ollama, vLLM, etc.)
  model: claude-sonnet-4-20250514
  max_tokens: 8192
  # thinking_budget: 0                            # >0 enables Claude extended thinking (reasoning tokens); must be < max_tokens (Claude only)
  # models:                                      # customize /model panel display
  #   opus: claude-opus-4-8
  #   sonnet: claude-sonnet-4-6
  #   haiku: claude-haiku-4-5

  # --- OpenAI-compatible example (uncomment to use) ---
  # provider: openai
  # api_key: "${OPENAI_API_KEY}"
  # model: gpt-4o
  # max_tokens: 8192
  #
  # --- Local model via Ollama (uncomment to use) ---
  # provider: openai-compatible
  # api_key: ""                                  # Ollama doesn't need an API key
  # base_url: "http://localhost:11434/v1"
  # model: llama3.1

telegram:
  token: "${TELEGRAM_BOT_TOKEN}"
  allowed_user_ids:
    - 123456789

# TUI (Terminal UI) channel — use `daimon tui` to start
tui:
  auto_approve: false   # set true to skip tool approval prompts
  # theme: ""           # reserved for future use

agent:
  max_iterations: 20
  episode_enabled: true  # route inbound chat through the episode kernel; false falls back to legacy agent loop
  kernel_fallback_enabled: false  # when true, failed chat episodes may re-run through the legacy loop; default keeps governance strict
  subagent_episode_enabled: true  # synchronous subagents run as episodes with forced Outcome handoff and governance
  # Heart: the autonomous event path. When enabled, non-chat events (a timer
  # heartbeat today; mail/calendar later) flow through heart → attention router
  # → a channel-less episode. The chat reply path is unaffected. Off by default;
  # turning it on is the "resident agent" switch. Autonomous episodes deny any
  # tool that requires approval (no human channel to sign off), so only
  # read-only/auto-approved tools run unattended.
  heart_enabled: false
  heart:
    heartbeat_interval_minutes: 0  # 0 = no timer source; >0 fires internal.heartbeat every N minutes
    daily_brief_interval_minutes: 0  # 0 = off; >0 sends a deterministic 24h digest (journal + proposals + holds) to the user every N minutes (use 1440 for daily)
    health_interval_minutes: 0     # 0 = off; >0 runs deterministic selfops health checks when feature selfops is enabled
    sleep_interval_minutes: 0      # 0 = off; >0 runs autonomous sleep maintenance every N minutes (use 1440 for daily)
    sleep_idle_minutes: 0          # 0 = no idle gate; >0 requires this many idle minutes before autonomous sleep runs
    # Local directories watched by the fs source (fsnotify). Empty = off.
    # Use absolute paths or ${HOME}/...; do not watch ~/.daimon, or the agent's
    # own writes can feed back into the heart.
    fs_watch_dirs: []
    # IMAP mail sensory source. Disabled by default. Password MUST be an
    # app-password supplied via env var, never plaintext. Intended for the
    # agent's own low-volume mailbox: UNSEEN is re-fetched each poll and
    # deduped by Message-ID in the heart store.
    mail:
      enabled: false
      imap_host: "imap.gmail.com"
      imap_port: 993
      username: "${GMAIL_USERNAME}"
      password: "${GMAIL_APP_PASSWORD}"
      mailbox: "INBOX"
      poll_interval_seconds: 60
    # CalDAV calendar sensory source. Disabled by default. Password MUST be an
    # app-password supplied via env var, never plaintext. calendar_paths empty
    # means auto-discover all VEVENT calendars from the calendar home set.
    calendar:
      enabled: false
      caldav_url: "https://caldav.icloud.com"
      username: "${CALDAV_USERNAME}"
      password: "${CALDAV_PASSWORD}"
      calendar_paths: []
      poll_interval_seconds: 300  # 0 = 300s default
      lookahead_minutes: 1440     # 0 = 1440 (24h) default
    model_router: false            # also triage events with the small (haiku) model when rules don't match
    chat_through_heart: false      # record inbound chat in the event stream (audit + dedup on message id) before handling; reply path unchanged
    # Event kinds (exact or prefix) that ALWAYS wake the user, ahead of any rule
    # or model decision. Safe defaults (payment./security./legal./account.delete)
    # are always applied; these only widen the net, never shrink it.
    high_risk_kinds: []
    # Explicit reflex_id -> deterministic tool-workflow mapping for attention
    # rules with action: reflex. Reflex workflows run as internal/autonomous
    # tool calls: read-only tools can run; writes/network/destructive tools are
    # denied unless the governance layer is explicitly extended.
    reflexes: {}
    # Example:
    # reflexes:
    #   mail_digest:
    #     workflow_path: "${HOME}/.daimon/reflexes/mail-digest.yaml"
    #     timeout_seconds: 60
  # Action holds: the compensable-action recall queue. When enabled, mutating
  # HTTP calls that already passed permission/value gates are queued, can be
  # recalled for the window below, then auto-execute. Off by default; when off,
  # tool execution behavior is unchanged.
  action:
    hold_enabled: false
    hold_window_seconds: 120
    hold_drain_interval_seconds: 15
  # Routing is governed by ~/.daimon/attention/rules.yaml — a top-level YAML list
  # matched first (after the high-risk whitelist). Unmatched events default to
  # Cognize (prefer to wake over silently dropping). Record routing corrections
  # with /attention feedback <event_id> <given> <expected> [note]. Example rule:
  #   - source: timer
  #     kind: internal.heartbeat
  #     action: ignore        # ignore | reflex | cognize | wake_user
  #     reflex_id: mail_digest  # required when action: reflex
  execution:
    max_parallel_tools: 3
  # Context compression strategy (Phase 1 performance optimization)
  # "layered": progressive multi-layer compression (recommended)
  # "legacy": original single-pass LLM compression
  compression:
    strategy: layered
    layers:
      tool_output_reduce_pct: 30   # Layer 1: reduce tool outputs (truncate + evict)
      summarize_pct: 60             # Layer 2: LLM summarize old turns
      emergency_pct: 85             # Layer 3: emergency truncation (soft then hard)
    token_estimate_ratio: 0.25  # chars-to-tokens ratio (4 chars ≈ 1 token)
  system_prompt: |
    You are Daimon, a helpful AI assistant with access to tools.
    You can execute shell commands, read/write files, and make HTTP requests.
    Always explain what you're about to do before using tools.

store:
  path: "${HOME}/.daimon/data/daimon.db"

telemetry:
  enabled: true
  trace_path: "${HOME}/.daimon/traces/events.jsonl"
  replay_enabled: true                         # record replay-grade provider/tool payloads by default
  replay_dir: "${HOME}/.daimon/replays"        # daily JSONL replay files are written here

memory:
  # enabled: true                      # 默认开启，无需显式设置
  storage_type: file                   # "file" (推荐) 或 "sqlite" (传统)
  storage_dir: ~/.daimon/memory      # 文件存储目录（默认）
  embedding_model: text-embedding-3-small  # 或 text-embedding-3-large（3072维，更高精度）
  openai_api_key: ${OPENAI_API_KEY}

  # 本地 embedding fallback：无有效 openai_api_key 时启用（opt-in，默认关）。
  # 走本地 OpenAI 兼容引擎 Ollama，daemon 需自行常驻（daimon 不托管该进程）。
  # local_embedding:
  #   enabled: true
  #   engine: ollama
  #   model: nomic-embed-text          # 768 维
  #   host: http://localhost:11434
  #   auto_pull: true                  # 模型缺失时经 daemon 自动拉取（首次可能下载数百 MB）
  # 维度提示：nomic-embed-text 是 768 维，与 text-embedding-3-small 的 1536 维不兼容。
  # 从 openai 切到本地需重建已存向量，并把下方 vector_dimension 改为 768。

  # World 语义检索默认关闭；开启需有效 openai_api_key 或 local_embedding。
  # 开启后每次检索会 embed 查询（可能产生 API 成本），并对 journal 行做暴力 cosine 扫描，
  # 适合中等规模记忆库；大规模前应先引入索引。
  semantic_retrieval: false

  # fact_extraction: true          # legacy key: enable lifecycle decisions for explicit memory saves
  # similarity_threshold: 0.85     # 去重阈值
  # bm25_weight: 0.4               # BM25 权重
  # vector_weight: 0.6             # 向量权重

  # 性能优化配置
  # enable_vss: true               # 启用 HNSW 索引（需要 sqlite-vss 扩展）
  # vector_dimension: 1536         # 向量维度（text-embedding-3-small: 1536, 3-large: 3072）
  # enable_search_cache: true      # 启用搜索结果缓存
  # search_cache_size: 500         # 缓存查询数量
  # search_cache_ttl: 5m           # 缓存过期时间

  # 文件存储配置
  file_storage:
    flush_interval: 5s             # 事务日志刷新间隔
    chunk_threshold: 200           # 超过此数量的事实时自动分块
    compression: false             # 是否压缩大文件

tools:
  bash:
    enabled: true
    timeout: 30s
    requires_approval: true
    blocked_commands:
      - "rm -rf /"
      - "shutdown"
      - "reboot"
      - "mkfs"
  file:
    enabled: true
    requires_approval: false
  http:
    enabled: true
    requires_approval: false
    timeout: 30s
  # SMTP send tool. Requires an app-password; sends route through the
  # compensable hold queue (agent.action.hold_enabled) so there is a recall
  # window before the mail actually goes out.
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    username: "${GMAIL_USERNAME}"
    password: "${GMAIL_APP_PASSWORD}"
    from: "${GMAIL_USERNAME}"
  # Shell execution backend for the bash tool.
  #   host     — run commands directly (default)
  #   seatbelt — run every command under the macOS sandbox (sandbox-exec)
  # Regardless of this default, commands triggered by a non-local source
  # (remote/scheduled/internal/background) are ALWAYS sandboxed; if the sandbox
  # is unavailable they are refused. Only local seatbelt opt-in may fall back to
  # host with a warning.
  exec:
    backend: host
  # MCP (Model Context Protocol) 工具集成
  # 通过 STDIO 传输连接外部 MCP Server，动态加载工具
  # 工具命名格式: mcp_{server名}_{tool名}
  # Concurrent execution of read-only tools (Phase 1 performance optimization)
  # When the LLM returns multiple tool calls, read-only tools execute in parallel
  concurrent_execution:
    enabled: true
    max_concurrency: 4  # maximum parallel read-only tools

  # Disk persistence for large tool results (Phase 1 performance optimization)
  # Results exceeding threshold are written to disk; only a preview stays in context
  result_persistence:
    enabled: true
    threshold_bytes: 8192   # persist results larger than this (8KB)
    preview_chars: 2000     # characters to keep inline as preview
    cache_dir: ""           # default: ~/.daimon/cache/tool-results/
    ttl_hours: 24           # auto-cleanup after this duration

  mcp:
    # Route MCP tools into the deferred catalog instead of the active registry.
    # When enabled, MCP tools are discovered via tool_search and loaded on demand
    # to save context. Default false keeps existing eager registration behavior.
    deferred: false
    servers:
      # GitHub MCP Server 示例
      # github:
      #   command: "docker"
      #   args: ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server"]
      #   env:
      #     GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"
      #   requires_approval: true
      # Filesystem MCP Server 示例
      # filesystem:
      #   command: "npx"
      #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/home/user/projects"]
      #   requires_approval: false

# Permission rules — configurable security policies for tool execution
# Rules are evaluated top-to-bottom, first match wins
# If no rules are configured, falls back to legacy blocked_commands behavior
#
# Actions: "none" (silent allow), "notify" (allow + log), "approve" (ask user), "deny" (block)
# Legacy values "allow" and "ask" still work (mapped to "none" and "approve" respectively)
permissions:
  default: approve   # "none", "notify", "approve", "deny" — action when no rule matches
  # Channel profiles set stricter runtime floors by source.
  # local=tui, remote=telegram/other adapters, scheduled=cron tasks, background=sub-agents.
  profiles:
    local:
      default: approve
    remote:
      require_approval_for_write: true
      require_approval_for_destructive: true
      require_approval_for_network: true
    scheduled:
      require_approval_for_write: true
      require_approval_for_destructive: true
      require_approval_for_network: true
    background:
      require_approval_for_write: true
      require_approval_for_destructive: true
      require_approval_for_network: true
  rules:
    - tool: bash
      pattern: "git *"
      action: none
    - tool: bash
      pattern: "rm -rf *"
      action: deny
    - tool: bash
      pattern: "shutdown"
      action: deny
    - tool: bash
      pattern: "DROP TABLE *"
      action: deny
    - tool: file
      path_pattern: "/etc/*"
      action: deny
    # - tool: "*"
    #   action: approve   # catch-all fallback

# Hook event system — pluggable handlers at lifecycle points
hooks:
  pre_tool_use:
    - type: safety_analyzer
      config:
        block_patterns:
          - "rm -rf /"
          - "DROP TABLE"
          - ":(){ :|:& };:"
  post_tool_use:
    - type: audit_logger
    # - type: permission_audit    # Writes permission decisions to SQLite audit log
  on_user_message:               # Context injectors — inject environment info into system prompt
    - type: git_context           # Git branch + status
      config:
        timeout_ms: 2000
        include_diff_stat: false
    - type: workdir_context       # Current directory + file listing
      config:
        include_ls: true
        max_files: 20

server:
  addr: "127.0.0.1:8080"
  enabled: false

log:
  level: info
  format: text

# Multi-agent system — sub-agents run in-process (goroutine execution).
#
# multi_agent:
#   agents:
#     researcher:

# Cost ledger pricing (DAIMON_BLUEPRINT.md §4.11).
#
# The agent records every episode's token usage to the costs table automatically;
# `daimon costs` reports those tokens always, and converts them to dollars only for
# models you price here. No rates are hard-coded — they vary by provider/endpoint
# and change over time. A model id is matched exactly first, then by longest
# substring, so a "claude-opus" key prices every "claude-opus-4-…" variant.
# Rates are USD per million tokens.
#
# economy:
#   prices:
#     claude-opus:
#       input_per_mtok: 15.0
#       output_per_mtok: 75.0
#       cache_read_per_mtok: 1.5
#       cache_creation_per_mtok: 18.75
#     claude-sonnet:
#       input_per_mtok: 3.0
#       output_per_mtok: 15.0
#       cache_read_per_mtok: 0.3
#       cache_creation_per_mtok: 3.75
#
# Throttle thresholds (blueprint §4.11): `daimon costs` flags activity classes that
# exceed their budget or deliver poor value (the clean-outcome rate from the ROI
# report). Flagging is always advisory in the report; runtime enforcement is gated
# by `enforce` (default false). When enforce is true, a periodic eval auto-throttles
# flagged classes — their autonomous Cognize episodes are skipped, the user is
# notified once, and it is reversible (the class un-throttles when its ROI recovers,
# or the user runs `/throttle off <class>`). WakeUser, reflexes, chat, and high-risk
# kinds are never throttled. A zero/unset threshold disables that check, so an absent
# `throttle` block flags nothing.
#
#   throttle:
#     enforce: false              # true = auto-throttle flagged classes (notify + vetoable via /throttle)
#     per_class_budget_usd: 5.0   # flag a class spending more than this over the window
#     min_clean_rate: 0.5         # flag a class whose clean-outcome rate is below this (0..1)
#     min_episodes: 5             # but only once it has at least this many episodes
