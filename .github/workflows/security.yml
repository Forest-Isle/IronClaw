name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: read
  security-events: write

jobs:
  gosec:
    name: Go Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.27.1
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        # Code Scanning upload requires GitHub Advanced Security, which is not
        # available on private repos without a license. Keep the step so it
        # activates automatically if GHAS is enabled, but don't fail the job.
        continue-on-error: true
        if: always()
        with:
          sarif_file: results.sarif

  vulnerability-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        # Use package-level scanning instead of the default symbol level. The
        # symbol scan builds an SSA call graph, which panics on generic code
        # under govulncheck v1.4.0 / x/tools v0.46.0 (golang/go#70350, #75584).
        # Package-level scanning skips the call graph and still flags
        # vulnerable imported packages.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -scan package ./...

  license-scan:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest
      - name: Check licenses
        run: |
          go-licenses check ./... --disallowed_types=forbidden,restricted || true
          echo "⚠️  License check complete - review manually if needed"
