name: Package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            cc: x86_64-linux-gnu-gcc
          - runner: ubuntu-24.04
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
          - runner: macos-14
            goos: darwin
            goarch: amd64
            cc: clang
            cgo_arch: x86_64
          - runner: macos-14
            goos: darwin
            goarch: arm64
            cc: clang
            cgo_arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Linux cross compiler
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          if [[ "${{ matrix.goarch }}" == "amd64" ]]; then
            sudo apt-get install -y gcc-x86-64-linux-gnu
          else
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi
      - name: Package native binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CGO_ARCH: ${{ matrix.cgo_arch }}
          VERSION: snapshot-${{ github.sha }}
          OUTPUT_DIR: dist
        run: |
          if [[ "$GOOS" == "darwin" ]]; then
            export CGO_CFLAGS="-arch $CGO_ARCH"
            export CGO_LDFLAGS="-arch $CGO_ARCH"
          fi
          scripts/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: daimon_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/daimon_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error
